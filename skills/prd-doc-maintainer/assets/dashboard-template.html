<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD Library Dashboard</title>
  <style>
    :root { color-scheme: light; --ink:#172026; --muted:#66737f; --line:#d9e1e8; --bg:#f7f9fb; --panel:#ffffff; --accent:#0f766e; --warn:#b45309; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:28px 32px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
    h1 { margin:0 0 6px; font-size:28px; letter-spacing:0; }
    main { padding:24px 32px 40px; max-width:1200px; margin:0 auto; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
    .metric { font-size:30px; font-weight:700; margin-top:6px; }
    .split { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em; }
    a { color:var(--accent); text-decoration:none; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid var(--line); border-radius:999px; background:#f4f7f8; font-size:12px; }
    .bar { height:8px; background:#e7edf1; border-radius:999px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--accent); }
    @media (max-width: 800px) { header, main { padding-left:16px; padding-right:16px; } .grid, .split { grid-template-columns:1fr; } table { font-size:13px; } }
  </style>
</head>
<body>
  <header>
    <h1>PRD Library Dashboard</h1>
    <div class="muted">Generated at <span id="generatedAt"></span></div>
  </header>
  <main>
    <section class="grid" id="metrics"></section>
    <section class="split">
      <div class="card">
        <h2>Documents</h2>
        <table>
          <thead><tr><th>Title</th><th>Status</th><th>Owner</th><th>Updated</th><th>Links</th></tr></thead>
          <tbody id="docs"></tbody>
        </table>
      </div>
      <div class="card">
        <h2>Status Mix</h2>
        <div id="statuses"></div>
        <h2>Recent Changes</h2>
        <div id="changes"></div>
      </div>
    </section>
  </main>
  <script id="prd-data" type="application/json">__PRD_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('prd-data').textContent);
    const byId = id => document.getElementById(id);
    byId('generatedAt').textContent = data.generated_at;
    const metricItems = [
      ['Documents', data.summary.total_docs],
      ['Active', data.summary.active_docs],
      ['Archived', data.summary.archived_docs],
      ['Related Links', data.summary.related_links]
    ];
    byId('metrics').innerHTML = metricItems.map(([label, value]) => `<div class="card"><div class="muted">${label}</div><div class="metric">${value}</div></div>`).join('');
    byId('docs').innerHTML = data.documents.map(doc => `<tr><td><a href="../${doc.path}">${doc.title}</a><div class="muted">${doc.product || ''}</div></td><td><span class="pill">${doc.status || 'unknown'}</span></td><td>${doc.owner || ''}</td><td>${doc.updated || ''}</td><td>${doc.related_count}</td></tr>`).join('');
    const max = Math.max(1, ...Object.values(data.status_counts));
    byId('statuses').innerHTML = Object.entries(data.status_counts).map(([status, count]) => `<p><span class="pill">${status}</span> ${count}</p><div class="bar"><span style="width:${Math.round(count / max * 100)}%"></span></div>`).join('');
    byId('changes').innerHTML = data.recent_changes.length ? data.recent_changes.map(item => `<p><strong>${item.title}</strong><br><span class="muted">${item.date} ${item.version || ''}</span></p>`).join('') : '<p class="muted">No changelog entries found.</p>';
  </script>
</body>
</html>

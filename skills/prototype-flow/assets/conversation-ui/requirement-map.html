<section id="__ROOT_ID__" class="pf-requirement-map" aria-labelledby="__ROOT_ID__-title">
  <div class="rm-window">
    <header class="rm-header"><div class="rm-heading"><p class="rm-eyebrow" data-role="context"></p><h2 id="__ROOT_ID__-title" data-role="title">需求地图</h2></div><span class="rm-source-label" data-role="source-label"></span></header>
    <div class="rm-summary"><span data-role="summary"></span><span class="rm-secondary" data-role="revision"></span></div>
    <div class="rm-toolbar" aria-label="需求浏览工具">
      <div class="rm-filters">
        <label class="rm-search"><span class="rm-sr">搜索需求名称或编号</span><input type="search" data-role="search" placeholder="搜索需求名称或编号" autocomplete="off"></label>
        <label><span class="rm-sr">筛选模块</span><select data-role="module-filter" aria-label="筛选模块"><option value="">全部模块</option></select></label>
        <label><span class="rm-sr">筛选 Demo 状态</span><select data-role="status-filter" aria-label="筛选 Demo 状态"><option value="">全部 Demo 状态</option></select></label>
      </div>
      <div class="rm-view-tools"><div class="rm-segment" aria-label="需求展示方式"><button type="button" data-action="view-graph" aria-pressed="true">关系图</button><button type="button" data-action="view-list" aria-pressed="false">列表</button></div><span class="rm-small rm-result-count" data-role="result-count"></span><div class="rm-tool-actions"><button type="button" class="rm-text-button" data-action="expand-all">全部展开</button><button type="button" class="rm-text-button" data-action="collapse-all">全部收起</button><button type="button" class="rm-text-button" data-action="locate-current">定位当前</button><button type="button" class="rm-text-button" data-action="open-detail">查看详情</button></div></div>
    </div>
    <div class="rm-body" data-role="body">
      <section class="rm-map-panel" aria-label="项目、模块与需求关系图"><div class="rm-map-scroll" data-role="map-scroll" role="region" aria-label="需求结构浏览区" tabindex="0"><div class="rm-map" data-role="map"><svg class="rm-connections" data-role="connections" aria-hidden="true"></svg><div class="rm-project" data-role="project-node"><span class="rm-kicker">项目</span><strong data-role="project-title"></strong><span class="rm-small" data-role="project-summary"></span></div><div class="rm-branches" data-role="branches"></div></div><p class="rm-empty" data-role="empty" hidden>当前范围尚未整理需求。</p></div><p class="rm-map-caption">节点数字：已生成 / 已声明页面状态。点击需求核对详情。</p></section>
      <aside class="rm-inspector" id="__ROOT_ID__-inspector" data-role="inspector" aria-labelledby="__ROOT_ID__-detail-title">
        <div class="rm-detail-header"><div class="rm-inspector-top"><span class="rm-small" data-role="detail-context"></span><div class="rm-detail-head-actions"><details class="rm-full-title" data-role="full-title" hidden><summary>完整标题</summary><p data-role="full-title-text"></p></details><button type="button" class="rm-text-button" data-action="close-detail">返回需求图</button></div></div><h3 id="__ROOT_ID__-detail-title" data-role="detail-title"></h3><div class="rm-detail-tags" data-role="detail-tags"><span class="rm-status" data-role="detail-status"></span><span class="rm-small" data-role="requirement-status"></span></div><p class="rm-filter-notice" data-role="filter-notice" hidden>当前需求不在筛选结果中，详情继续保留。</p></div>
        <div class="rm-detail-tabs" role="tablist" aria-label="需求详情分区" data-role="detail-tabs"><button type="button" id="__ROOT_ID__-tab-requirement" role="tab" data-detail-tab="requirement" aria-controls="__ROOT_ID__-panel-requirement" aria-selected="true">需求</button><button type="button" id="__ROOT_ID__-tab-coverage" role="tab" data-detail-tab="coverage" aria-controls="__ROOT_ID__-panel-coverage" aria-selected="false" tabindex="-1">Demo 覆盖</button><button type="button" id="__ROOT_ID__-tab-sources" role="tab" data-detail-tab="sources" aria-controls="__ROOT_ID__-panel-sources" aria-selected="false" tabindex="-1">依据</button></div>
        <div class="rm-detail-scroll" data-role="detail-scroll" role="region" aria-label="需求详情阅读区" tabindex="0"><p class="rm-detail-empty" data-role="detail-empty" hidden></p><div data-role="detail-content">
          <section id="__ROOT_ID__-panel-requirement" class="rm-tab-panel" role="tabpanel" aria-labelledby="__ROOT_ID__-tab-requirement" data-role="tab-requirement"><section class="rm-detail-section" data-scroll-key="description"><h4>需求说明</h4><p class="rm-description" data-role="description"></p></section><section class="rm-detail-section" data-role="business-acceptance-section" data-scroll-key="business-acceptance" hidden><h4>验收条件</h4><ul class="rm-business-acceptance" data-role="business-acceptance"></ul></section></section>
          <section id="__ROOT_ID__-panel-coverage" class="rm-tab-panel" role="tabpanel" aria-labelledby="__ROOT_ID__-tab-coverage" data-role="tab-coverage" hidden><section class="rm-detail-section" data-scroll-key="coverage-summary"><h4>覆盖进度</h4><div class="rm-counts"><span>已生成 <strong data-role="generated-count"></strong></span><span>已验证 <strong data-role="verified-count"></strong></span></div><div class="rm-coverage-track" role="progressbar" aria-label="当前需求页面状态生成覆盖" data-role="coverage-bar"><span data-role="coverage-fill"></span></div><p class="rm-small" data-role="coverage-unknown" hidden>范围未声明，暂不能计算完整覆盖率。</p><p class="rm-gap" data-role="gap"></p></section><section class="rm-detail-section" data-role="task-section" data-scroll-key="task" hidden><h4>当前生成任务</h4><p data-role="task-status"></p><p class="rm-small" data-role="task-summary"></p></section><section class="rm-detail-section"><h4>页面状态与验证记录</h4><ul class="rm-criteria" data-role="criteria" aria-label="逐项页面状态覆盖"></ul></section><section class="rm-detail-section" data-role="pages-section" data-scroll-key="other-pages"><h4 data-role="pages-title">其他关联页面</h4><ul class="rm-pages" data-role="pages"></ul></section></section>
          <section id="__ROOT_ID__-panel-sources" class="rm-tab-panel" role="tabpanel" aria-labelledby="__ROOT_ID__-tab-sources" data-role="tab-sources" hidden><details class="rm-source" data-role="sources-section" open><summary>资料依据</summary><div data-role="sources"></div></details></section>
        </div></div>
      </aside>
    </div>
    <footer class="rm-footer"><span data-role="footer-status"></span><span data-role="connection-status">对话快照</span><span data-role="observed-at"></span><button type="button" class="rm-text-button" data-action="retry-sync" hidden>重新同步</button></footer><p class="rm-sr" data-role="announcer" aria-live="polite"></p>
  </div><script type="application/json" data-role="payload">__SNAPSHOT_JSON__</script>
</section>
